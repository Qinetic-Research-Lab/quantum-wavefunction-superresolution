name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff>=0.8"

      - name: Ruff undefined-name check
        run: python -m ruff check main.py physics_engine.py model.py utils.py

      - name: Byte-compile modules
        run: |
          python -m py_compile main.py physics_engine.py model.py utils.py
